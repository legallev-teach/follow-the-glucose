<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow the Glucose – HSB</title>
<style>
:root{--bg:#fbf6e9;--ink:#1d2a20;--mute:#5d6b60;--green:#1f7a4d;--leaf:#2f9e5f;--pale:#e4f3e3;--cane:#f1c550;--sun:#e9831f;--no:#b93a2b;--nobg:#fbe6e2;--card:#fff;--line:#dcd5c0;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--green);color:#fff;padding:10px 16px}
header .in{max-width:720px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
header b{font-size:19px;letter-spacing:.2px}
header span{font-size:13px;opacity:.9}
main{max-width:720px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:26px;line-height:1.2;margin:.2em 0 .4em}
h2{font-size:21px;line-height:1.25;margin:.2em 0 .5em}
h3{font-size:18px;margin:.2em 0 .4em}
p{margin:.5em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.big{display:block;width:100%;min-height:52px;margin-top:14px;padding:12px 16px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:17px}
.big:disabled{background:#a9b5ab;cursor:not-allowed}
.big.alt{background:#fff;color:var(--green);border:2px solid var(--green)}
.link{background:none;border:0;padding:8px 4px;color:var(--green);text-decoration:underline;font-size:15px}
input,select,textarea{font:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--cane);outline-offset:1px}
label{display:block;font-weight:600;margin:12px 0 4px}
.q{font-weight:700;font-size:18px;margin:.2em 0 .6em}
.opts{display:grid;gap:10px}
.opt,.bin,.chip,.tog{min-height:50px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:left;line-height:1.35}
.opt:hover:not(:disabled),.bin:hover,.chip:hover:not(:disabled){border-color:var(--leaf)}
.opt.ok{border-color:var(--green);background:var(--pale);font-weight:700;opacity:1}
.opt.no{border-color:var(--no);background:var(--nobg);color:#7a2a20;text-decoration:line-through}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--sun);background:#fff4e6;font-weight:700}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{text-align:center;font-weight:700;background:#fffaf0;border-color:var(--cane)}
.bigcard{margin:10px 0 14px;padding:18px 14px;border-radius:14px;background:#fff8dc;border:2px dashed var(--cane);text-align:center;font-size:20px;font-weight:700}
.count{font-size:14px;color:var(--mute);margin:0}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:16px}
.fb.ok{background:var(--pale);border-left:6px solid var(--green)}
.fb.no{background:var(--nobg);border-left:6px solid var(--no)}
.fb:empty{display:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{text-align:center;flex:1 1 auto}
.chip:disabled{opacity:.35}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;padding:12px;background:#f4f1e4;border-radius:12px}
.eq.vert{display:block}
.eq.vert .row{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-weight:400}
.eq.vert .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;text-align:center;font-weight:700;line-height:28px}
.slot{display:inline-block;min-width:74px;padding:6px 10px;border-radius:9px;border:2px dashed #a9a38e;background:#fff;text-align:center;color:#8a8573}
.slot.fill{border-style:solid;border-color:var(--green);background:var(--pale);color:var(--ink)}
.slot.now{border-color:var(--sun);box-shadow:0 0 0 3px #fbe0bf}
.eq.vert .slot{flex:1;text-align:left}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.shead .t{flex:1;min-width:180px}
.shead small{display:block;color:var(--mute);font-size:13px}
.shead b{font-size:19px}
.bar{height:8px;background:#e6dfc8;border-radius:8px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--cane);transition:width .3s}
.bridge{background:#fff8dc;border-radius:12px;padding:14px;border-left:6px solid var(--cane)}
.wait{color:var(--no);font-size:15px}
table.g{border-collapse:collapse;width:100%;font-size:16px}
table.g td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.g td:first-child{font-weight:800;color:var(--green);white-space:nowrap}
.term{font-weight:700;color:var(--green)}
.stn{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;margin:8px 0;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:left}
.stn .e{font-size:26px;width:36px;text-align:center}
.stn .x{flex:1}.stn .x small{display:block;color:var(--mute);font-size:13.5px}
.stn.done{border-color:var(--green);background:var(--pale)}
.stn.next{border-color:var(--sun);box-shadow:0 0 0 3px #fbe0bf}
.stn:disabled{opacity:.5;cursor:not-allowed}
.ring{display:block;width:100%;max-width:330px;margin:0 auto}
svg text{font-family:inherit}
.vis{display:block;width:100%;max-width:520px;margin:8px auto;border-radius:12px}
.togs{display:grid;gap:8px;margin-top:8px}
.tog{text-align:left}.tog.on{background:var(--pale);border-color:var(--green);font-weight:700}
[data-part]{cursor:pointer}
.found{filter:drop-shadow(0 0 4px #e9831f)}
.rows .r{margin:6px 0}.rows .r div{height:34px;border-radius:8px;background:var(--leaf);color:#fff;font-size:13.5px;font-weight:700;line-height:34px;padding:0 8px;white-space:nowrap;min-width:max-content}
.rows small{color:var(--mute)}
.rev{display:grid;gap:8px;margin-top:8px}
.meter{height:26px;border-radius:8px;background:#eee7d2;overflow:hidden}.meter i{display:block;height:100%;background:var(--sun);transition:width .5s}
.sum td{padding:6px 8px;border-bottom:1px solid var(--line)}.sum{width:100%;border-collapse:collapse}.sum td:last-child{text-align:right;font-weight:700}
.markbig{font-size:44px;font-weight:800;color:var(--green);text-align:center;margin:4px 0}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:1px}
.teach{border:2px dashed var(--sun);background:#fff4e6}
.sub,.sup{font-size:.75em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-95px);opacity:.1}}
@keyframes drift{from{transform:translate(0,0);opacity:1}to{transform:translate(-55px,8px);opacity:0}}
@keyframes bub{from{transform:translateY(0);opacity:1}to{transform:translateY(-50px);opacity:0}}
.wat circle{animation:rise 2.2s linear infinite}.wat circle:nth-child(2){animation-delay:.7s}.wat circle:nth-child(3){animation-delay:1.4s}
.co2 text{animation:drift 2.6s linear infinite}.co2 text:nth-child(2){animation-delay:1.3s}
.o2 text{animation:bub 2.4s linear infinite}.o2 text:nth-child(2){animation-delay:1.2s}
.hide{display:none}
.enz g{transition:transform .8s ease}
@media (max-width:420px){header span{display:none}body{font-size:16.5px}.card{padding:14px}h1{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";

let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.st||S.st.length!==6) S={name:'',cls:'',pred:{},st:[0,1,2,3,4,5].map(blank),fin:Object.assign(blank(),{ans:''}),secs:0,sent:false};
if(!S.pred) S.pred={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ================= HELPERS ================= */
const app=document.getElementById('app');
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let view='start',cur=0,tickHook=null,lastAct=Date.now();
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{
  if(document.visibilityState!=='visible'||Date.now()-lastAct>120000||!S.name) return;
  S.secs++; if(view==='stn'&&!S.st[cur].done) S.st[cur].secs++;
  if(S.secs%10===0) save();
  if(tickHook) tickHook();
},1000);
function mark(st,ok){ if(st.done) return; if(!st.tried){st.tot++; if(ok) st.first++; st.tried=true;} save(); }
function fb(el,ok,html){const f=$('#fb',el); f.className='fb '+(ok?'ok':'no'); f.innerHTML=(ok?'✓ ':'✗ ')+html; }
function cont(el,done,label){const b=document.createElement('button');b.className='big';b.textContent=label||'Continue';b.onclick=done;el.appendChild(b);b.scrollIntoView({block:'nearest',behavior:'smooth'});}
function shakeIt(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}

/* ================= PICTURES ================= */
function cellSVG(){return `<svg class="vis" viewBox="0 0 340 240" role="img" aria-label="Diagram of a plant cell with parts lettered A to G">
<rect data-part="wall" x="9" y="9" width="322" height="222" rx="24" fill="none" stroke="#3f8f3a" stroke-width="18"/>

<g data-part="chl" fill="#2f9e5f" stroke="#17643a" stroke-width="2"><ellipse cx="268" cy="58" rx="24" ry="12"/><ellipse cx="72" cy="182" rx="24" ry="12"/><ellipse cx="282" cy="186" rx="22" ry="11"/></g>
<g data-part="mit" fill="#f29a4a" stroke="#a8541a" stroke-width="2"><ellipse cx="160" cy="48" rx="19" ry="9"/><ellipse cx="170" cy="200" rx="19" ry="9"/></g>
<g font-size="14" font-weight="800" text-anchor="middle" fill="#1d2a20">
${[['wall',120,10,'A'],['mem',316,120,'B'],['cyto',52,130,'C'],['nuc',70,104,'D'],['chl',268,58,'E'],['mit',160,48,'F'],['vac',190,126,'G']].map(m=>`<g data-part="${m[0]}"><circle cx="${m[1]}" cy="${m[2]}" r="12" fill="#fff" stroke="#1d2a20" stroke-width="2"/><text x="${m[1]}" y="${m[2]+5}">${m[3]}</text></g>`).join('')}
</g></svg>`}
const PART={wall:'the <b>cell wall</b>, the tough outer layer',mem:'the <b>cell membrane</b>, the thin layer just inside the wall',cyto:'the <b>cytoplasm</b>, the jelly that fills the cell',nuc:'the <b>nucleus</b>',chl:'a <b>chloroplast</b>',mit:'a <b>mitochondrion</b>',vac:'the large <b>vacuole</b>'};

function leafSVG(){return `<svg class="vis" viewBox="0 0 340 230" role="img" aria-label="A sugarcane plant with the sun, the soil and the air">
<rect width="340" height="180" fill="#dff1fb"/><rect y="178" width="340" height="52" fill="#9c6b3f"/>
<circle cx="48" cy="44" r="24" fill="#f6c443"/>
<g id="rays" class="hide" stroke="#f6a623" stroke-width="4" stroke-linecap="round"><line x1="78" y1="52" x2="118" y2="64"/><line x1="76" y1="66" x2="110" y2="88"/><line x1="64" y1="78" x2="90" y2="108"/></g>
<rect x="164" y="74" width="13" height="106" rx="5" fill="#a7c957"/><g stroke="#6a8f2e" stroke-width="2"><line x1="164" y1="105" x2="177" y2="105"/><line x1="164" y1="135" x2="177" y2="135"/><line x1="164" y1="160" x2="177" y2="160"/></g>
<g fill="none" stroke="#2f9e5f" stroke-width="11" stroke-linecap="round"><path d="M170 82 Q128 36 84 78"/><path d="M171 82 Q226 26 276 76"/><path d="M172 112 Q228 88 268 124"/><path d="M168 118 Q128 100 98 132"/></g>
<g fill="none" stroke="#f3e3c6" stroke-width="3" stroke-linecap="round"><path d="M170 180 Q160 200 140 214"/><path d="M171 180 Q176 204 196 218"/><path d="M170 180 V222"/></g>
<g id="wat" class="wat hide" fill="#2a8fd6"><circle cx="170" cy="205" r="4"/><circle cx="170" cy="205" r="4"/><circle cx="170" cy="205" r="4"/></g>
<g id="co2" class="co2 hide" font-size="13" font-weight="700" fill="#555"><text x="304" y="60">CO₂</text><text x="308" y="104">CO₂</text></g>
<g id="out" class="hide"><polygon points="232,40 246,32 260,40 260,56 246,64 232,56" fill="#f1c550" stroke="#a87b12" stroke-width="2"/><text x="246" y="80" font-size="12" font-weight="700" text-anchor="middle">glucose</text>
<g class="o2" font-size="13" font-weight="700" fill="#1f6fb5"><text x="112" y="62">O₂</text><text x="134" y="54">O₂</text></g></g>
<text x="8" y="222" font-size="12" fill="#fff">soil</text></svg>`}

function enzSVG(){return `<svg class="vis enz" viewBox="0 0 340 170" role="img" aria-label="The enzyme sucrase with a sucrose molecule">
<path d="M84 162 V104 H130 A22 22 0 0 0 174 104 A22 22 0 0 0 218 104 H262 V162 Z" fill="#9a6fc9" stroke="#5d3b8c" stroke-width="3"/>
<text x="173" y="148" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">sucrase (enzyme)</text>
<text x="173" y="96" font-size="11" fill="#5d3b8c" text-anchor="middle" id="aslab">active site</text>
<g id="sub" transform="translate(-70,-62)"><line id="bond" x1="152" y1="104" x2="196" y2="104" stroke="#333" stroke-width="5"/>
<g id="glu"><circle cx="152" cy="104" r="20" fill="#f1c550" stroke="#a87b12" stroke-width="2"/><text x="152" y="108" font-size="10" font-weight="700" text-anchor="middle">glucose</text></g>
<g id="fru"><circle cx="196" cy="104" r="20" fill="#f29a4a" stroke="#a8541a" stroke-width="2"/><text x="196" y="108" font-size="10" font-weight="700" text-anchor="middle">fructose</text></g></g></svg>`}

function ringSVG(){const E=['🌱','🔬','☀️','🦗','🍛','⚡'];let o='';const pt=i=>{const a=(-90+i*60)*Math.PI/180;return [150+105*Math.cos(a),150+105*Math.sin(a)]};
for(let i=0;i<6;i++){const [x,y]=pt(i),d=S.st[i].done;const nxt=!d&&(i===0||S.st[i-1].done);
o+=`<circle cx="${x}" cy="${y}" r="27" fill="${d?'#e4f3e3':nxt?'#fff8dc':'#f1ede0'}" stroke="${d?'#1f7a4d':nxt?'#e9831f':'#c9c2ab'}" stroke-width="3"/><text x="${x}" y="${y+8}" font-size="23" text-anchor="middle">${E[i]}</text><text x="${x+20}" y="${y-18}" font-size="13" font-weight="800" fill="#1d2a20">${i+1}</text>`}
return `<svg class="ring" viewBox="0 0 300 300" role="img" aria-label="The six stations arranged in a loop"><circle cx="150" cy="150" r="105" fill="none" stroke="#f1c550" stroke-width="5" stroke-dasharray="3 9" stroke-linecap="round"/>${o}
<polygon points="150,120 176,135 176,165 150,180 124,165 124,135" fill="#f1c550" stroke="#a87b12" stroke-width="2"/><text x="150" y="155" font-size="13" font-weight="800" text-anchor="middle">glucose</text></svg>`}

/* ================= THE SIX STATIONS ================= */
const STN=[
/* ---------- 1 ---------- */
{title:'Is it alive?',emoji:'🌱',topic:'Characteristics of living things',steps:[
{t:'learn',h:'What makes something a living thing?',html:`<p>Our journey starts in a cane field in Trinidad. Before we follow anything, we must ask a simple question: is the sugarcane plant <b>alive</b>? It does not walk and it does not make a sound.</p>
<p>Biologists say that a thing is living only if it carries out <b>all seven</b> of these life processes. The first letters spell <b>G.R.I.M.N.E.R.</b></p>
<table class="g"><tr><td>G</td><td><b>Growth</b>: it gets bigger and this change is permanent.</td></tr><tr><td>R</td><td><b>Respiration</b>: it releases energy from food inside its cells.</td></tr><tr><td>I</td><td><b>Irritability</b>: it responds to changes around it. (This is also called sensitivity.)</td></tr><tr><td>M</td><td><b>Movement</b>: it moves all or part of itself.</td></tr><tr><td>N</td><td><b>Nutrition</b>: it makes food or takes in food.</td></tr><tr><td>E</td><td><b>Excretion</b>: it gets rid of waste that was made inside its own body.</td></tr><tr><td>R</td><td><b>Reproduction</b>: it makes more of its own kind.</td></tr></table>`},
{t:'mcq',q:'You touch a Ti-Marie plant (the "shame bush") and its leaves close up at once. Which life process is this?',a:0,o:[['Irritability','' ],['Growth','Growth is a permanent increase in size. The leaves open again later, so nothing has grown.'],['Nutrition','Nutrition is making food or taking in food. Closing the leaves is not feeding.'],['Excretion','Excretion is getting rid of waste. The plant is not removing any waste here.']],why:'The plant sensed your touch and responded to it. Responding to a change is irritability.'},
{t:'mcq',q:'Inside your cells, glucose is broken down to release energy. Which life process is this?',a:0,o:[['Respiration',''],['Nutrition','Nutrition is getting the food. Releasing the energy from that food is a different process.'],['Excretion','Excretion is the removal of waste. Here the cell is releasing energy.'],['Movement','Movement uses energy, but it is not the process that releases the energy.']],why:'Respiration is the release of energy from food. It happens inside every living cell. It is not the same thing as breathing.'},
{t:'mcq',q:'You breathe out carbon dioxide and you sweat. Which life process are both of these?',a:0,o:[['Excretion',''],['Respiration','Respiration makes the carbon dioxide. Getting rid of that carbon dioxide is another process.'],['Irritability','Irritability is responding to a change. Removing waste is not a response to something outside.'],['Reproduction','Reproduction is making more of your own kind.']],why:'Carbon dioxide and sweat contain waste that your own cells made. Removing waste made inside the body is excretion.'},
{t:'mcq',q:'A sugarcane leaf uses sunlight to make its own food. Which life process is this?',a:0,o:[['Nutrition',''],['Respiration','Respiration releases energy from food. Here the plant is making the food.'],['Growth','The food will help the plant to grow later, but making the food is a different process.'],['Movement','The leaf is not moving. It is making food.']],why:'Nutrition means making food or taking in food. Plants make their own. Animals must eat.'},
{t:'sort',q:'Living or not living? Remember that a living thing must carry out ALL seven processes.',bins:['Living','Not living'],cards:[
['🌾 A sugarcane plant',0,'Sugarcane is living. It grows, it makes food, it respires, and its leaves turn toward the light.'],
['🚗 A car with the engine running',1,'A car moves, uses fuel and gives off waste gases, but it does not grow and it does not reproduce. It is not living.'],
['🍞 Yeast (used to make bread)',0,'Yeast is living. It is a tiny fungus. It feeds on sugar, respires, grows and reproduces.'],
['🔥 A bush fire',1,'A fire seems to grow, move and "feed", but it has no cells, it does not respire and it does not reproduce its own kind. It is not living.'],
['🫘 A dry pigeon pea seed',0,'The seed is living. It is resting. Give it water and it will grow. Its cells are still respiring very slowly.'],
['🦠 A virus on a door handle',1,'On its own, a virus cannot feed, respire, grow or reproduce. It can only make copies of itself inside a living cell. That is why most biologists do not class it as a living thing.'],
['🍄 A mushroom on a rotten log',0,'A mushroom is living. It is a fungus that feeds on the dead wood, grows and reproduces by spores.']]},
{t:'mcq',q:'A yeast cell grows a small bud, and the bud breaks off as a new yeast cell. Only one parent is needed. What type of reproduction is this?',a:0,o:[['Asexual reproduction',''],['Sexual reproduction','Sexual reproduction usually needs two parents and special sex cells called gametes. Here there is only one parent.'],['Aerobic reproduction','"Aerobic" describes respiration that uses oxygen. It is not a type of reproduction.']],why:'Asexual reproduction needs only one parent, and the offspring are the same as the parent.'},
{t:'bridge',html:`<p>The sugarcane is alive, so it must carry out all of G.R.I.M.N.E.R. But a cane plant has no mouth, no lungs and no stomach. <b>So where do these life processes happen?</b></p><p>They happen inside very small units called <b>cells</b>. At the next station you will go inside one.</p>`}
]},
/* ---------- 2 ---------- */
{title:'Build the cell',emoji:'🔬',topic:'Plant and animal cells',steps:[
{t:'learn',h:'Inside a cell from the cane leaf',html:`<p>A <b>cell</b> is the smallest unit of a living thing that is fully alive. Cells make up a living thing the way bricks make up a house.</p><p>Inside a cell are small parts called <b>organelles</b>. The word means "little organs". Each one has its own job. This is a plant cell from the cane leaf.</p>${cellSVG()}
<table class="g"><tr><td>A</td><td><b>Cell wall</b>: a tough outer layer made of cellulose. It gives the plant cell a fixed shape.</td></tr><tr><td>B</td><td><b>Cell membrane</b>: a thin layer that controls what enters and leaves the cell.</td></tr><tr><td>C</td><td><b>Cytoplasm</b>: a jelly-like substance where many chemical reactions take place.</td></tr><tr><td>D</td><td><b>Nucleus</b>: it controls the activities of the cell and holds the genetic material (DNA).</td></tr><tr><td>E</td><td><b>Chloroplast</b>: it contains green chlorophyll, which traps light. Photosynthesis happens here.</td></tr><tr><td>F</td><td><b>Mitochondrion</b> (more than one are called mitochondria): respiration releases energy here.</td></tr><tr><td>G</td><td><b>Vacuole</b>: a large space filled with a watery liquid called cell sap. It helps to keep the cell firm.</td></tr></table><p>Study the diagram. On the next screen the table will be gone.</p>`},
{t:'tap',prompts:[
['nuc','Tap the part that <b>controls the activities of the cell</b>.','The nucleus controls the cell and holds the DNA.'],
['chl','Tap a part where <b>photosynthesis</b> takes place.','Chloroplasts contain chlorophyll, which traps light for photosynthesis.'],
['mem','Tap the part that <b>controls what enters and leaves the cell</b>.','The cell membrane is the thin layer just inside the cell wall. It controls what goes in and out.'],
['mit','Tap a part where <b>respiration releases energy</b>.','Mitochondria release energy from glucose. Remember this for Station 6.'],
['wall','Tap the tough layer made of cellulose that <b>gives the plant cell its fixed shape</b>.','The cell wall is made of cellulose. You will meet cellulose again at Station 5, where it is called fibre.'],
['vac','Tap the part that is <b>filled with cell sap</b>.','The large vacuole is filled with cell sap.'],
['cyto','Tap the jelly-like substance <b>where many chemical reactions take place</b>.','The cytoplasm fills the cell, and the organelles sit in it.']]},
{t:'learn',h:'Plant cells, animal cells and bacteria',html:`<p>The cells in your body are <b>animal cells</b>. They have a nucleus, cytoplasm, a cell membrane and mitochondria, just like the plant cell. But they have <b>no cell wall</b>, <b>no chloroplasts</b> and <b>no large vacuole</b>.</p><p>Plant cells and animal cells both have a true nucleus. Cells with a true nucleus are called <span class="term">eukaryotic</span> cells.</p><p>A <b>bacterium</b> is different. It has no true nucleus. Its genetic material lies loose in the cytoplasm. Cells like this are called <span class="term">prokaryotic</span> cells. A bacterium is also much smaller than a plant or animal cell, and a virus is smaller still.</p>`},
{t:'sort',q:'Is this part found only in plant cells, or in both plant cells and animal cells?',bins:['Plant cells only','Both plant and animal cells'],cards:[
['Chloroplast',0,'Only plant cells have chloroplasts. This is why animals cannot make their own food.'],
['Nucleus',1,'Both types of cell have a nucleus to control the cell.'],
['Cell wall',0,'Only plant cells have a cell wall. Animal cells have a cell membrane as their outer layer.'],
['Mitochondria',1,'Both types of cell have mitochondria, because both plants and animals respire.'],
['Cell membrane',1,'Both types of cell have a cell membrane. In a plant cell it lies just inside the cell wall.'],
['Large vacuole filled with cell sap',0,'Only plant cells have a large vacuole.']]},
{t:'mcq',q:'How is a bacterium different from a plant cell and an animal cell?',a:0,o:[['It has no true nucleus.',''],['It has no cytoplasm.','A bacterium does have cytoplasm. Something else is missing.'],['It is not made of a cell.','A bacterium is one single cell.'],['It is much bigger.','A bacterium is much smaller than a plant or animal cell.']],why:'A bacterium is a prokaryotic cell. Its genetic material is not held inside a nucleus.'},
{t:'mcq',q:'An animal cell cannot make its own food. Which missing part explains this?',a:0,o:[['Chloroplasts',''],['Mitochondria','Animal cells do have mitochondria. Mitochondria release energy from food. They do not make food.'],['A nucleus','Animal cells do have a nucleus.'],['A cell membrane','Animal cells do have a cell membrane.']],why:'Without chloroplasts a cell cannot trap light, so it cannot carry out photosynthesis.'},
{t:'bridge',html:`<p>Only the plant cell has <b>chloroplasts</b>. That one small organelle is the reason plants can make food and animals cannot.</p><p>At the next station you will watch the chloroplasts in the cane leaf at work, and the glucose molecule that we are following will be made.</p>`}
]},
/* ---------- 3 ---------- */
{title:'The leaf factory',emoji:'☀️',topic:'Photosynthesis',steps:[
{t:'learn',h:'Cooking with sunlight',html:`<p>The word <span class="term">photosynthesis</span> has two parts. "Photo" means light. "Synthesis" means to combine. So photosynthesis means <b>to combine using light</b>.</p><p>What is the plant combining? Think of the <b>roots</b> and the <b>leaves</b>.</p><ul><li>The roots take up <b>water</b> from the soil. Tubes in the stem carry it up to the leaves.</li><li>The leaves take in <b>carbon dioxide</b> from the air through tiny holes called <span class="term">stomata</span>.</li><li>The green <b>chlorophyll</b> in the chloroplasts traps <b>light</b> energy from the sun.</li></ul><p>On the next screen you will make a prediction, and then run the leaf yourself.</p>`},
{t:'x',id:'leaf',pred:{q:'A cane leaf is in bright sunlight and its roots have plenty of water, but its stomata are closed. Will the leaf make glucose?',o:['Yes. Sunlight and water are enough.','No. Something is still missing.','Yes, but only at night.'],right:1,after:'With the stomata closed, carbon dioxide cannot enter the leaf. The leaf needs all three together: light, water and carbon dioxide. Switch the carbon dioxide off in the picture above and watch the glucose disappear.'}},
{t:'seq',q:'Build the word equation for photosynthesis. Tap the words in order to fill the blanks.',items:['carbon dioxide','water','glucose','oxygen','nitrogen','starch'],ans:[[0,1],[0,1],[2,3],[2,3]],sep:['',' + ',' → (light and chlorophyll) → ',' + ',''],
 hint:['The plant starts with two raw materials. One comes in through the stomata and one comes up from the roots.','The plant starts with two raw materials. One comes in through the stomata and one comes up from the roots.','The plant makes a sugar as its food, and it gives off a gas.','The plant makes a sugar as its food, and it gives off a gas.'],
 why:'Carbon dioxide + water → glucose + oxygen. Light supplies the energy, and chlorophyll traps the light.'},
{t:'mcq',q:'There is more carbon dioxide in the air outside the leaf than inside the leaf. So carbon dioxide spreads in through the stomata by itself. What is this movement called?',a:0,o:[['Diffusion',''],['Osmosis','Osmosis is the movement of water only, through a membrane.'],['Active transport','Active transport uses energy to pump a substance. Here the gas spreads in by itself.'],['Transpiration','Transpiration is the loss of water vapour from the leaf.']],why:'Diffusion is the movement of particles from where there are many of them to where there are few. You will use this again at Station 6.'},
{t:'mcq',q:'The leaf makes more glucose than it needs right away. In what form does the plant store the extra?',a:0,o:[['Starch',''],['Oxygen','Oxygen is a gas that the leaf gives off. It is not a stored food.'],['Chlorophyll','Chlorophyll is the green substance that traps light. It is not a food store.'],['Protein','Protein is made using nitrogen. Glucose is stored as a carbohydrate.']],why:'Many glucose molecules are joined into starch for storage. Cassava, dasheen and rice are full of starch. Sugarcane is unusual because it stores most of its sugar as sucrose in the stalk.'},
{t:'mcq',q:'Water evaporates from the leaves, and this pulls more water up from the roots. What is this loss of water from the leaves called?',a:0,o:[['Transpiration',''],['Respiration','Respiration is the release of energy from food.'],['Excretion','Excretion is the removal of waste made by the body.'],['Photosynthesis','Photosynthesis is the making of food using light.']],why:'Transpiration keeps water flowing through the plant, carries dissolved minerals along with it, and cools the plant.'},
{t:'mcq',q:'Air is 78% nitrogen, and a plant needs nitrogen to make protein. How does the cane plant get its nitrogen?',a:0,o:[['Its roots take in nitrates dissolved in the water in the soil.',''],['Its leaves take nitrogen gas straight from the air.','Plants cannot use nitrogen gas from the air. Neither can you. You cannot just "breathe it in".'],['It makes nitrogen during photosynthesis.','Photosynthesis makes glucose and oxygen. It does not make nitrogen.']],why:'Bacteria in the soil change nitrogen into nitrates. Roots take in the nitrates, and the plant uses them to make protein. You get your nitrogen when you eat protein.'},
{t:'bridge',html:`<p>Light energy from the sun is now locked inside a <b>glucose</b> molecule in the cane. The plant made its own food, so it did not have to eat anything.</p><p>You cannot do that. Neither can a grasshopper or a bird. <b>So how does the energy in that glucose reach an animal?</b> Something has to eat the plant.</p>`}
]},
/* ---------- 4 ---------- */
{title:'Who eats whom?',emoji:'🦗',topic:'Food chains and energy flow',steps:[
{t:'learn',h:'Passing the energy on',html:`<p>A <span class="term">food chain</span> shows what eats what. It shows how energy passes from one living thing to the next.</p><table class="g"><tr><td>Producer</td><td>A living thing that <b>makes</b> its own food. Green plants are producers.</td></tr><tr><td>Consumer</td><td>A living thing that gets food by <b>eating</b> other living things.</td></tr><tr><td>Primary consumer</td><td>It eats the producer. An animal that eats only plants is a <b>herbivore</b>.</td></tr><tr><td>Secondary consumer</td><td>It eats the primary consumer. An animal that eats other animals is a <b>carnivore</b>.</td></tr><tr><td>Tertiary consumer</td><td>It eats the secondary consumer.</td></tr></table><p>Each step in a food chain is called a <span class="term">trophic level</span>. The producer is the first trophic level.</p>`},
{t:'seq',q:'Build a food chain from a cane field. Tap the living things in order, starting with the producer.',items:['🌾 Sugarcane','🦗 Grasshopper','🐦 Kiskadee','🦅 Hawk'],ans:[[0],[1],[2],[3]],sep:['',' → ',' → ',' → ',''],
 hint:['A food chain always begins with a producer. The producer is the one that makes its own food.','Which of these eats plants?','Which bird catches and eats insects?','Only the top consumer is left.'],
 why:'Sugarcane → grasshopper → kiskadee → hawk. The cane makes the food. Each animal gets its energy from the one before it.'},
{t:'mcq',q:'Look at this part of the chain: grasshopper → kiskadee. What does the arrow show?',a:0,o:[['Energy passes from the grasshopper to the kiskadee.',''],['The grasshopper eats the kiskadee.','Read the arrow as "is eaten by". The grasshopper is eaten by the kiskadee.'],['The grasshopper grows into a kiskadee.','A food chain shows feeding. It does not show how an animal grows.']],why:'The arrow points the way the energy flows. Energy flows in one direction only.'},
{t:'mcq',q:'In the chain sugarcane → grasshopper → kiskadee → hawk, what is the kiskadee?',a:0,o:[['The secondary consumer',''],['The primary consumer','The primary consumer is the one that eats the producer. That is the grasshopper.'],['The producer','A producer makes its own food. The kiskadee has to eat.'],['The tertiary consumer','The tertiary consumer eats the secondary consumer. That is the hawk.']],why:'The kiskadee eats the primary consumer, so it is the secondary consumer. It is at the third trophic level.'},
{t:'x',id:'energy',pred:{q:'The sugarcane traps 10 000 units of energy from the sun. How much of that energy do you think reaches the hawk at the end of the food chain?',o:['All 10 000 units','About half of it: 5 000 units','About 1 000 units','Only about 10 units'],right:3,after:'Only about 10 units reach the hawk. At every level, most of the energy is used up or lost before the next animal can eat it.'}},
{t:'mcq',q:'The sugarcane holds 10 000 units of energy. Only about 10% passes on at each step. About how much energy reaches the kiskadee?',a:0,o:[['100 units',''],['1 000 units','That is what reaches the grasshopper. The kiskadee is one more step along.'],['10 units','That is what reaches the hawk. The kiskadee is one step before the hawk.'],['10 000 units','That is what the cane started with. Most of it is lost before it reaches the kiskadee.']],why:'10 000 → 1 000 (grasshopper) → 100 (kiskadee) → 10 (hawk).'},
{t:'mcq',q:'In a cane field there are thousands of grasshoppers but only one or two hawks. Why?',a:0,o:[['Very little energy is left by the time it reaches the top of the food chain.',''],['Hawks are bigger, so there is less room for them.','It is not about space. Think about how much energy reaches the hawk.'],['Hawks do not need energy.','Every living thing needs energy to carry out its life processes.']],why:'Energy is lost at every trophic level, so the top level can only support a few animals. This is also why most food chains have only four or five links.'},
{t:'mcq',q:'A kiskadee also eats small lizards and fruit, and a hawk also eats rats. When many food chains are joined together like this, what is the diagram called?',a:0,o:[['A food web',''],['A food pyramid','A pyramid shows how much energy or how many organisms are at each level. It does not show the joined chains.'],['A trophic level','A trophic level is one step in a food chain.']],why:'A food web is a set of food chains that are joined together. It gives a truer picture, because most animals eat more than one thing.'},
{t:'bridge',html:`<p>There is another consumer in that cane field: <b>you</b>. When you drink cane juice, or eat rice, or eat a mango, you are a primary consumer. The energy that the sun gave to the plant is now on your plate.</p><p>But a plate of food is not yet glucose in your cells. <b>What exactly is in the food, and what does your body do with it?</b></p>`}
]},
/* ---------- 5 ---------- */
{title:'The plate',emoji:'🍛',topic:'Food, nutrients, digestion and absorption',steps:[
{t:'learn',h:'Glorious food',html:`<p>Your <span class="term">diet</span> is the amount and the quality of the different types of food that you eat. <span class="term">Nutrients</span> are the useful substances that are found in food.</p><p>A <span class="term">balanced diet</span> has all the necessary nutrients in the correct amounts. It must include:</p><table class="g"><tr><td>Carbohydrates</td><td>The sugars and starches. They are the body's main source of <b>energy</b>.</td></tr><tr><td>Proteins</td><td>Long chains of amino acids. They are used for <b>growth and repair</b>.</td></tr><tr><td>Fats (lipids)</td><td>A store of energy. They are also part of every cell membrane.</td></tr><tr><td>Vitamins and minerals</td><td>Needed in small amounts to keep the body working well. These are the <b>micronutrients</b>.</td></tr><tr><td>Fibre</td><td>Cellulose from plant cell walls. It keeps food moving through the gut.</td></tr><tr><td>Water</td><td>It carries substances around the body, cools the body, and takes part in chemical reactions.</td></tr></table><p>Carbohydrates, proteins and fats are eaten in large amounts. They are called <b>macronutrients</b>.</p>`},
{t:'sort',q:'Sunday lunch. Which nutrient is each food the BEST source of?',bins:['Carbohydrate','Protein','Fat','Fibre and vitamins'],cards:[
['🍚 Rice',0,'Rice is mostly starch, and starch is a carbohydrate.'],
['🍗 Stewed chicken',1,'Meat, fish, eggs, peas and beans are good sources of protein.'],
['🥑 Zaboca (avocado)',2,'Zaboca is rich in oils. Fats and oils are both lipids.'],
['🥬 Callaloo (dasheen bush)',3,'Leafy vegetables give you fibre, vitamins and minerals.'],
['🍠 Cassava and dasheen (provision)',0,'Ground provision is full of starch, which is the stored glucose that the plant made by photosynthesis.'],
['🫘 Dhal (split peas)',1,'Peas and beans are plant sources of protein.'],
['🧈 Butter',2,'Butter is almost all fat.']]},
{t:'learn',h:'Three sizes of carbohydrate',html:`<p>Carbohydrates are made of sugar units. They are named by how many units are joined together.</p><table class="g"><tr><td>Monosaccharide</td><td>"Mono" means one. A single sugar unit. It is sweet and it dissolves in water. Examples: <b>glucose</b>, fructose, galactose.</td></tr><tr><td>Disaccharide</td><td>"Di" means two. Two sugar units joined. It is sweet and it dissolves in water. Examples: <b>sucrose</b> (cane sugar), maltose, lactose (milk sugar).</td></tr><tr><td>Polysaccharide</td><td>"Poly" means many. A long chain of sugar units. It is not sweet and it does not dissolve in water. Examples: <b>starch</b>, cellulose, glycogen.</td></tr></table>`},
{t:'sort',q:'Which type of carbohydrate is this?',bins:['Monosaccharide (one unit)','Disaccharide (two units)','Polysaccharide (many units)'],cards:[
['Glucose',0,'Glucose is a single sugar unit. It is the sugar that your cells use for energy.'],
['Sucrose (cane sugar)',1,'Sucrose is one glucose joined to one fructose.'],
['Starch',2,'Starch is a long chain of glucose units. It is how plants store glucose.'],
['Lactose (milk sugar)',1,'Lactose is made of two sugar units.'],
['Cellulose (fibre)',2,'Cellulose is a long chain that makes up plant cell walls. Humans cannot digest it, so it is our fibre.']]},
{t:'mcq',q:'What job does fibre do in the body?',a:0,o:[['It adds bulk, which helps the muscles of the gut to push food along.',''],['It is the main source of energy.','Humans cannot digest fibre, so we get no energy from it.'],['It is used to build muscle.','Protein is used for growth and repair. Fibre is not.']],why:'The wave-like squeezing that pushes food along the gut is called peristalsis. Fibre gives the gut muscles something to push against. Only plant foods contain fibre.'},
{t:'sort',q:'Some vitamins dissolve in water. Others dissolve in fat and can be stored in the body. Which group is each vitamin in? (The fat-soluble vitamins are A, D, E and K.)',bins:['Water-soluble','Fat-soluble'],cards:[
['Vitamin C',0,'Vitamin C dissolves in water. The body does not store it, so you need it often. Oranges, guavas and West Indian cherries are rich in it.'],
['Vitamin A',1,'Vitamin A is fat-soluble. Remember A, D, E and K.'],
['Vitamin D',1,'Vitamin D is fat-soluble. Your skin makes it in sunlight.'],
['The B vitamins',0,'The B vitamins and vitamin C are the water-soluble vitamins.']]},
{t:'learn',h:'From the plate to the blood',html:`<p>You already know that food is <b>broken down</b> in the gut, and that the wall of the small intestine is covered with tiny finger-like <b>villi</b>. Digested food passes through the villi into the body.</p><p>You have just drunk a glass of cane juice. It is full of <b>sucrose</b>. Remember that sucrose is a disaccharide: one glucose unit joined to one fructose unit.</p><p>The sucrose is now in your small intestine, right beside the villi. On the next screen you will predict what happens to it.</p>`},
{t:'x',id:'enzyme',pred:{q:'Can a sucrose molecule pass through the wall of a villus into your blood just as it is?',o:['Yes. It is already a sugar, so it can pass straight into the blood.','No. It must first be broken into single sugar units.','No. Sugar never enters the blood.'],right:1,after:'Sucrose is too big to pass through the wall of a villus. It must first be broken into single sugar units. Breaking food down into small, soluble molecules is called <b>digestion</b>, and the substances that do the chemical breaking are called <b>enzymes</b>.'}},
{t:'mcq',q:'What did the enzyme sucrase do to the sucrose molecule?',a:0,o:[['It broke it into one glucose and one fructose.',''],['It joined it to another sucrose to make starch.','Digestion breaks food molecules down into smaller ones. It does not join them into bigger ones.'],['It changed it into protein.','A sugar cannot be changed into a protein by digestion. The sucrose was split into two smaller sugars.']],why:'Sucrase splits each sucrose into two single sugar units: glucose and fructose. These are small enough to be absorbed.'},
{t:'mcq',q:'In the picture, the sucrose fitted into a pocket in the enzyme "like a key in a lock". A starch molecule has a different shape. What does this tell you about sucrase and starch?',a:0,o:[['Sucrase cannot break down starch, because starch does not fit.',''],['Sucrase can break down any food.','A key opens only the lock that it fits. An enzyme works the same way.'],['Starch does not need to be broken down.','Starch is a very long chain, so it certainly needs to be broken down. It needs a different enzyme.']],why:'Each enzyme breaks down only the one substance that fits it. The body makes a different enzyme for each type of food. You will study enzymes in detail later.'},
{t:'learn',h:'Through the villi',html:`<p>The food is now in small, soluble pieces, and it can be <b>absorbed</b>. Absorption means that digested food passes from the gut into the body. It happens through the <b>villi</b>.</p><p>Inside each villus there are two kinds of tube:</p><table class="g"><tr><td>Blood capillaries</td><td><b>Glucose</b> and <b>amino acids</b> pass into the blood here. (Amino acids are the small units that proteins are broken into.)</td></tr><tr><td>Lacteal</td><td>Digested <b>fats</b> pass into this tube in the middle of the villus.</td></tr></table><p>There are millions of villi. Together they give the small intestine a very large surface, so a lot of food can be absorbed quickly.</p>`},
{t:'mcq',q:'The glucose from the cane juice is absorbed through a villus. What does it pass into?',a:0,o:[['The blood capillaries',''],['The lacteal','The lacteal takes up digested fats. Glucose goes somewhere else.'],['The cell wall','Animal cells do not have cell walls. Remember Station 2.']],why:'Glucose passes into the blood capillaries inside the villus. The blood then carries it around the body.'},
{t:'mcq',q:'You also ate zaboca, which is rich in fat. After the fat is digested, what does it pass into inside the villus?',a:0,o:[['The lacteal',''],['The blood capillaries','Glucose and amino acids pass into the blood capillaries. Digested fats take a different route.'],['The stomata','Stomata are the tiny holes in a leaf. They are not found in the gut.']],why:'Digested fats pass into the lacteal in the middle of each villus.'},
{t:'mcq',q:'Why is it useful for the small intestine to have millions of villi and not a smooth wall?',a:0,o:[['They give a much larger surface, so more food is absorbed in the same time.',''],['They push the food along the gut.','The muscles of the gut wall push the food along. That is peristalsis. The villi have a different job.'],['They make the glucose.','Glucose was made in the leaf by photosynthesis. The villi only absorb it.']],why:'A larger surface means that more digested food can pass into the blood at the same time.'},
{t:'bridge',html:`<p>The sucrose from the cane has been digested into <b>glucose</b> and absorbed through a villus into your <b>blood</b>. Your blood now carries it to every cell in your body.</p><p>The glucose is right outside a muscle cell in your leg. <b>How does it get in, and how does the cell get the energy out of it?</b></p>`}
]},
/* ---------- 6 ---------- */
{title:'Into the cell and back to the leaf',emoji:'⚡',topic:'Movement of substances, and respiration',steps:[
{t:'learn',h:'Three ways in and out of a cell',html:`<p>Remember the <b>cell membrane</b> from Station 2. It controls what enters and leaves the cell. Substances cross it in three ways.</p><table class="g"><tr><td>Diffusion</td><td>Particles spread from where there are <b>many</b> of them to where there are <b>few</b>. No energy is needed. <i>Example: someone is cooking curry in the kitchen, and soon you can smell it in the bedroom.</i></td></tr><tr><td>Osmosis</td><td>The movement of <b>water</b> through a membrane, from where there is more water to where there is less water. <i>Example: you put salt on cucumber to make chow, and water comes out of the cucumber.</i></td></tr><tr><td>Active transport</td><td>The cell uses <b>energy</b> to pump a substance from where there is little of it to where there is already a lot. <i>Example: water will not flow up to the tank on the roof by itself. A pump has to use electricity to push it up.</i></td></tr></table>`},
{t:'mcq',q:'Your blood has a lot of oxygen. The muscle cell has very little, because it keeps using it up. Oxygen moves from the blood into the cell by itself. What is this?',a:0,o:[['Diffusion',''],['Osmosis','Osmosis is the movement of water only.'],['Active transport','Active transport needs energy and moves substances the "uphill" way. Here oxygen moves from many to few by itself.']],why:'Oxygen moves from where there is a lot of it to where there is little of it. This is diffusion.'},
{t:'mcq',q:'You leave a slice of raw cassava in a bowl of plain water. Water moves through the cell membranes into the cassava cells, and the slice becomes firm. What is the movement of water through a membrane called?',a:0,o:[['Osmosis',''],['Diffusion of oxygen','The question is about the movement of water.'],['Active transport','No pumping is taking place. The water moves by itself.']],why:'Osmosis is the special name for the movement of water through a membrane.'},
{t:'mcq',q:'A nerve cell already has a lot of potassium inside, but it pumps in even more. This uses energy. What is this?',a:0,o:[['Active transport',''],['Diffusion','Diffusion would carry the potassium out of the cell, from many to few. Here it is going the other way.'],['Osmosis','Osmosis is the movement of water only.']],why:'Moving a substance from few to many, against the natural direction, needs energy. This is active transport. The energy for it comes from respiration.'},
{t:'learn',h:'Getting the energy out',html:`<p>The glucose and the oxygen are now inside your muscle cell. They go to the <b>mitochondria</b>, which you met at Station 2.</p><p>In the mitochondria the glucose is broken down and its energy is released. This is <span class="term">respiration</span>, the "R" in G.R.I.M.N.E.R. It happens in every living cell, all the time.</p><p>Most of the time the cell has plenty of oxygen. On the next screen you will find out what happens when it does not.</p>`},
{t:'x',id:'resp',pred:{q:'A muscle cell is working hard and it runs out of oxygen. What do you think happens to the energy it can release from one glucose molecule?',o:['It releases more energy.','It releases the same amount of energy.','It releases much less energy.','It releases no energy at all, because respiration stops.'],right:2,after:'Without oxygen, respiration does not stop. It carries on, but the glucose is only partly broken down, so much less energy is released.'}},
{t:'seq',q:'Build the word equation for aerobic respiration. Tap the words in order to fill the blanks.',items:['glucose','oxygen','carbon dioxide','water','starch','light'],ans:[[0,1],[0,1],[2,3],[2,3]],sep:['',' + ',' → ',' + ',' + ENERGY'],

    <textarea id="ans" rows="8" maxlength="1500" placeholder="Start with the sunlight and the leaf…">${esc(f.ans)}</textarea><p class="count" id="wc"></p><button class="big" id="go">Save my answer and see my mark</button>`;
    const ta=$('#ans'),wc=$('#wc');
    const upd=()=>{f.ans=ta.value;const w=words(f.ans).length;wc.textContent=w+(w===1?' word. ':' words. ')+(goodAnswer(f.ans)?'✓ This is enough for the 3 marks.':w>=CFG.minWords?'Please write proper sentences, without repeating the same words, to earn the 3 marks.':'Write '+(CFG.minWords-w)+' more to earn the 3 marks.')};
    ta.oninput=()=>{upd();save()};upd();
    $('#go').onclick=()=>{f.done=true;save();result()};
  };
  if(f.sub>=FIN.ans.length&&f.wrote){write();return}
  R.seq(FIN,f,el,()=>{f.wrote=true;save();write();window.scrollTo(0,0)});
}
function words(t){return t.trim().split(/\s+/).filter(w=>/[a-zA-Z]/.test(w))}
function goodAnswer(t){const w=words(t);return w.length>=CFG.minWords&&new Set(w.map(x=>x.toLowerCase())).size>=15}
function calc(){
  const done=S.st.filter(s=>s.done).length,tot=S.st.reduce((a,s)=>a+s.tot,0),first=S.st.reduce((a,s)=>a+s.first,0);
  const acc=tot?Math.round(100*first/tot):0,conn=goodAnswer(S.fin.ans)?3:0,accM=(tot>0&&acc>=CFG.accPass)?1:0;
  const chainDone=S.fin.sub>=FIN.ans.length;
  return {done,acc,conn,accM,mark:done+conn+accM,by:S.st.map((s,i)=>(i+1)+': '+s.first+'/'+s.tot).join(' | '),mins:Math.max(1,Math.round(S.secs/60)),chain:chainDone?(S.fin.first===S.fin.tot?'Yes':'No'):'Not attempted'};
}
function vcode(name,cls,mark,done,acc){
  const s=[String(name).trim().toLowerCase().replace(/\s+/g,' '),cls,mark,done,acc,'cane-field-2026'].join('|');
  let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  const b=(h>>>0).toString(36).toUpperCase().padStart(7,'0');return b.slice(0,3)+'-'+b.slice(3,7);
}
function predText(){const N={leaf:3,energy:4,enzyme:5,resp:6};let o=[];STN.forEach(D=>D.steps.forEach(s=>{const p=s.pred&&S.pred[s.id];if(p)o.push('Station '+N[s.id]+': predicted "'+s.pred.o[p.c]+'" ('+(p.c===s.pred.right?'matched':'did not match')+'). Reason: '+p.why)}));return o.join(' | ')}
function withPred(o,t){if(CFG.e.pred)o[CFG.e.pred]=t;return o}
function payload(){const r=calc(),e=CFG.e;return withPred({[e.name]:S.name,[e.cls]:S.cls,[e.mark]:r.mark,[e.stations]:r.done,[e.acc]:r.acc,[e.by]:r.by,[e.time]:r.mins,[e.chain]:r.chain,[e.ans]:S.fin.ans.trim(),[e.code]:vcode(S.name,S.cls,r.mark,r.done,r.acc)},predText())}
function sample(){const e=CFG.e;return withPred({[e.name]:'Test Student',[e.cls]:'TEST',[e.mark]:9,[e.stations]:6,[e.acc]:72,[e.by]:'1: 9/12 | 2: 12/15 | 3: 5/8 | 4: 7/10 | 5: 15/20 | 6: 9/12',[e.time]:28,[e.chain]:'Yes',[e.ans]:'The sugarcane leaf used light to make glucose by photosynthesis. I ate it, enzymes digested it, and my cells respired the glucose to release energy for my leg muscles.',[e.code]:vcode('Test Student','TEST',9,6,72)},'Station 3: predicted "Yes. Sunlight and water are enough." (did not match). Reason: Plants only need sun and water to grow so it should make food.')}
function prefill(p){return CFG.view+'?usp=pp_url&'+new URLSearchParams(p).toString()}
async function post(p){ if(navigator.onLine===false) return false;
  try{await fetch(CFG.submit,{method:'POST',mode:'no-cors',body:new URLSearchParams(p)});return true}catch(e){return false}}
function result(){view='res';tickHook=null;window.scrollTo(0,0);
  const r=calc(),p=payload(),code=p[CFG.e.code];
  app.innerHTML=`<div class="shead"><button class="link" id="map">← Map</button></div><div class="card"><h2>Your effort mark</h2><div class="markbig">${r.mark} / 10</div>
  <table class="sum"><tr><td>Stations finished (1 mark each)</td><td>${r.done} / 6</td></tr><tr><td>Connection answer (3 marks for a full answer of ${CFG.minWords} words or more)</td><td>${r.conn} / 3</td></tr><tr><td>Correct on the first try: ${r.acc}% (1 mark for ${CFG.accPass}% or more)</td><td>${r.accM} / 1</td></tr><tr><td>Time spent</td><td>${r.mins} min</td></tr><tr><td>Verification code</td><td class="code">${code}</td></tr></table>
  ${r.mark<10?`<p><b>You can still raise this mark.</b> ${r.done<6?'Finish the remaining stations. ':''}${r.conn<3?'Write a full connection answer in the final task. ':''}Then come back to this page and send again.</p>`:''}
  <p>${esc(S.name)} · ${esc(S.cls)}</p>
  <button class="big" id="send">${S.sent?'Send my results again':'Send my results to '+CFG.teacher}</button><div id="fb" class="fb"></div></div>`;
  $('#map').onclick=home;
  const f=$('#fb');const backup=`<a href="${prefill(p)}" target="_blank" rel="noopener">open the results form</a>`;
  $('#send').onclick=async()=>{const b=$('#send');b.disabled=true;b.textContent='Sending…';
    const ok=await post(payload());
    if(ok){S.sent=true;save();f.className='fb ok';f.innerHTML=`✓ <b>Your results were sent to ${CFG.teacher}.</b> Your mark is ${r.mark}/10 and your code is <span class="code">${code}</span>. You may take a screenshot of this page as your proof.<br><br>If ${CFG.teacher} tells you that your results did not arrive, ${backup} and press <b>Submit</b> at the bottom of it.`;b.textContent='Send my results again';b.disabled=false;b.classList.add('alt')}
    else{f.className='fb no';f.innerHTML=`Your results could <b>not</b> be sent from this page. Check that you are connected to the internet and try again. If it still does not work, ${backup}. Your answers will already be filled in. Press <b>Submit</b> at the bottom of the form.`;b.textContent='Try again';b.disabled=false}
    f.scrollIntoView({behavior:'smooth',block:'nearest'})};
}
/* ================= START ================= */
if(S.name&&S.cls) home(); else start();
</script>
